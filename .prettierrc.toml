# This is my goddamn repository. This is my style guidelines.
# You'll have to pay me if you want me using another style.
printWidth              = 80
tabWidth                = 4
useTabs                 = true
semi                    = true
singleQuote             = false
quoteProps              = "consistent"
trailingComma           = "all"
bracketSpacing          = false
objectWrap              = "preserve"
bracketSameLine         = false
arrowParens             = "always"
vueIndentScriptAndStyle = true
endOfLine               = "lf"
singleAttributePerLine  = true
